<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片裁切工具</title>
  <link rel="stylesheet" href="vendor/cropper.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 3v14a2 2 0 0 0 2 2h12" />
            <path d="M3 7h14a2 2 0 0 1 2 2v12" />
            <path d="M3 3v5h5M21 21v-5h-5" />
          </svg>
        </div>
        <div>
          <p class="brand-kicker">PIXEL CROP</p>
          <h1>图片裁切工具</h1>
        </div>
      </div>
      <div class="header-actions" id="headerActions" hidden>
        <button type="button" id="downloadBtn" class="btn btn-primary header-action">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5" />
            <path d="M5 19.5h14" />
          </svg>
          <span id="downloadBtnLabel">下载</span>
        </button>
        <button type="button" id="uploadNewBtn" class="btn header-action header-action-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
            <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
          </svg>
          <span>上传</span>
        </button>
      </div>
    </header>

    <input class="visually-hidden" type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">

    <section class="upload-section" id="uploadSection" aria-labelledby="uploadTitle">
      <div class="upload-visual" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="8" y="8" width="32" height="32" rx="8" />
          <path d="M15 32.5 21.5 26l5 5 3.5-3.5 3 3" />
          <circle cx="30.5" cy="18.5" r="3" />
          <path d="M24 2v7M20.5 5.5h7" />
        </svg>
      </div>
      <p class="section-kicker">开始裁切</p>
      <h2 id="uploadTitle">选择一张图片</h2>
      <p class="upload-description">精准调整画面比例与像素尺寸，处理过程仅在本地完成。</p>
      <button type="button" id="uploadBtn" class="btn btn-primary upload-button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
          <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
        </svg>
        选择图片
      </button>
      <p class="hint">支持 JPG、PNG、WebP · 下载时保留原格式</p>
    </section>

    <section class="crop-section" id="cropSection" aria-label="图片裁切编辑器" hidden>
      <div class="workspace-card">
        <div class="workspace-meta">
          <div class="workspace-title">
            <span class="workspace-kicker">编辑画布</span>
            <strong id="cropModeLabel">自由裁切</strong>
          </div>
          <div class="workspace-tools">
            <div class="canvas-actions" aria-label="画面调整">
              <button type="button" id="rotateLeftBtn" class="canvas-tool-button" aria-label="左旋转" title="左旋转">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 9V4m0 0h5M4 4l3.8 3.8A7 7 0 1 1 5.4 15" />
                </svg>
              </button>
              <button type="button" id="rotateRightBtn" class="canvas-tool-button" aria-label="右旋转" title="右旋转">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M20 9V4m0 0h-5m5-1-3.8 3.8A7 7 0 1 0 18.6 15" />
                </svg>
              </button>
              <button type="button" id="flipHBtn" class="canvas-tool-button" aria-label="水平翻转" title="水平翻转">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 3v18M9.5 6 4 12l5.5 6V6Zm5 0 5.5 6-5.5 6V6Z" />
                </svg>
              </button>
              <button type="button" id="flipVBtn" class="canvas-tool-button" aria-label="垂直翻转" title="垂直翻转">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 12h18M6 9.5 12 4l6 5.5H6Zm0 5L12 20l6-5.5H6Z" />
                </svg>
              </button>
            </div>
            <output id="cropSizeBadge" class="size-badge" aria-live="polite">准备中</output>
          </div>
        </div>
        <div class="image-container">
          <img id="image" src="" alt="待裁切图片">
        </div>
      </div>

      <div class="controls">
        <section class="control-section" aria-labelledby="sizeSectionTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">SIZE &amp; RATIO</p>
              <h2 id="sizeSectionTitle">裁切规格</h2>
            </div>
            <p>选择预设或自定义比例</p>
          </div>

          <div class="control-block">
            <div class="label-row">
              <h3>证件照尺寸</h3>
              <span>按 300 DPI 换算</span>
            </div>
            <div class="btn-group preset-group">
              <button type="button" class="btn btn-ratio" data-width="260" data-height="378" aria-pressed="false">
                <span class="preset-name">小一寸</span>
                <small>22×32 mm · 260×378 px</small>
              </button>
              <button type="button" class="btn btn-ratio" data-width="295" data-height="413" aria-pressed="false">
                <span class="preset-name">一寸</span>
                <small>25×35 mm · 295×413 px</small>
              </button>
              <button type="button" class="btn btn-ratio" data-width="390" data-height="567" aria-pressed="false">
                <span class="preset-name">大一寸</span>
                <small>33×48 mm · 390×567 px</small>
              </button>
              <button type="button" class="btn btn-ratio" data-width="413" data-height="531" aria-pressed="false">
                <span class="preset-name">小二寸</span>
                <small>35×45 mm · 413×531 px</small>
              </button>
              <button type="button" class="btn btn-ratio" data-width="413" data-height="579" aria-pressed="false">
                <span class="preset-name">二寸</span>
                <small>35×49 mm · 413×579 px</small>
              </button>
              <button type="button" class="btn btn-ratio" data-width="413" data-height="626" aria-pressed="false">
                <span class="preset-name">大二寸</span>
                <small>35×53 mm · 413×626 px</small>
              </button>
            </div>
          </div>

          <div class="control-block">
            <div class="label-row">
              <h3>常用比例</h3>
              <span>自由裁切或快速比例</span>
            </div>
            <div class="btn-group ratio-presets">
              <button type="button" class="btn btn-ratio active" id="freeRatioButton" data-ratio="free" aria-pressed="true"><span>自由</span></button>
              <button type="button" class="btn btn-ratio" data-ratio="1" aria-pressed="false"><span>1:1</span></button>
              <button type="button" class="btn btn-ratio" data-ratio="1.3333333333" aria-pressed="false"><span>4:3</span></button>
              <button type="button" class="btn btn-ratio" data-ratio="1.7777777778" aria-pressed="false"><span>16:9</span></button>
            </div>
          </div>

          <div class="control-block fixed-ratio-block">
            <div class="fixed-ratio-row">
              <button type="button" class="btn btn-ratio ratio-mode-button" id="fixedRatioButton" data-ratio="fixed" aria-pressed="false" aria-controls="customRatioInputs">
                <svg class="ratio-mode-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="6.5" y="10.5" width="11" height="9" rx="2" />
                  <path d="M9 10.5V8a3 3 0 0 1 6 0v2.5" />
                </svg>
                <span>固定比例</span>
              </button>
              <div class="custom-ratio-inputs" id="customRatioInputs" aria-label="固定比例宽高">
                <div class="custom-ratio-fields">
                  <label class="custom-ratio-field" for="customRatioWidthInput">
                    <span>宽</span>
                    <span class="number-input">
                      <input id="customRatioWidthInput" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" aria-describedby="sizeError">
                      <span>px</span>
                    </span>
                  </label>
                  <span class="size-separator" aria-hidden="true">×</span>
                  <label class="custom-ratio-field" for="customRatioHeightInput">
                    <span>高</span>
                    <span class="number-input">
                      <input id="customRatioHeightInput" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" aria-describedby="sizeError">
                      <span>px</span>
                    </span>
                  </label>
                </div>
                <p class="size-error" id="sizeError" role="alert" hidden></p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="vendor/cropper.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
