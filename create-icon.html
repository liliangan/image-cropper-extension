<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>生成插件图标</title>
  <style>
    html, body { margin: 0; width: 128px; height: 128px; overflow: hidden; }
    button, br { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="128" height="128"></canvas>
  <br>
  <button onclick="download()">下载图标</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const background = ctx.createLinearGradient(22, 12, 106, 116);
    background.addColorStop(0, '#222c43');
    background.addColorStop(1, '#111827');

    ctx.beginPath();
    ctx.roundRect(6, 6, 116, 116, 29);
    ctx.fillStyle = background;
    ctx.fill();

    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(36, 22);
    ctx.lineTo(36, 80);
    ctx.quadraticCurveTo(36, 92, 48, 92);
    ctx.lineTo(106, 92);
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    const accent = ctx.createLinearGradient(25, 34, 99, 103);
    accent.addColorStop(0, '#aeb3ff');
    accent.addColorStop(1, '#746eff');

    ctx.beginPath();
    ctx.moveTo(22, 36);
    ctx.lineTo(80, 36);
    ctx.quadraticCurveTo(92, 36, 92, 48);
    ctx.lineTo(92, 106);
    ctx.strokeStyle = accent;
    ctx.stroke();

    function download() {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon.png';
        a.click();
        URL.revokeObjectURL(url);
      });
    }
  </script>
</body>
</html>
